name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const manifest = JSON.parse(readFileSync("manifest.json", "utf8"));
          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const versions = JSON.parse(readFileSync("versions.json", "utf8"));
          const tag = process.env.RELEASE_TAG;

          if (manifest.version !== tag || packageJson.version !== tag) {
            throw new Error(`Tag ${tag} does not match manifest/package version`);
          }
          if (versions[tag] !== manifest.minAppVersion) {
            throw new Error(`versions.json does not map ${tag} to ${manifest.minAppVersion}`);
          }
          NODE

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build release assets
        run: npm run build

      - name: Attest release assets
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            main.js manifest.json styles.css \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Murmur ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
